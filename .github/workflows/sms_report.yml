name: Daily Dollar SMS Report


# ============================================================
# Trigger
# ============================================================

on:

  # اجرای خودکار روزانه
  schedule:

    # 08:00 UTC
    # برابر با 11:30 به وقت تهران در زمان UTC+3:30
    - cron: "0 8 * * *"

  # امکان اجرای دستی از GitHub
  workflow_dispatch:


# ============================================================
# Job
# ============================================================

jobs:

  send-sms:

    name: Generate and Send Dollar Report

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # Run Python script
      # ------------------------------------------------------

      - name: Run SMS report

        env:

          OPENAI_API_KEY:
            ${{ secrets.OPENAI_API_KEY }}

          MELIPAYAMAK_USERNAME:
            ${{ secrets.MELIPAYAMAK_USERNAME }}

          MELIPAYAMAK_PASSWORD:
            ${{ secrets.MELIPAYAMAK_PASSWORD }}

          MELIPAYAMAK_FROM:
            ${{ secrets.MELIPAYAMAK_FROM }}

          SMS_TO:
            ${{ secrets.SMS_TO }}

        run: |

          python main.py
